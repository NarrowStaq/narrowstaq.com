<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: SG; src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2'); font-weight: 300 700; }
  @font-face { font-family: JB; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2'); font-weight: 100 800; }
  @font-face { font-family: IN; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #08090c; color: #e8eaee; font-family: IN, sans-serif;
    box-sizing: border-box; padding: 64px 72px;
    display: flex; flex-direction: column;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(#1f242d 1px, transparent 1px), linear-gradient(90deg, #1f242d 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 85% 0%, #000 10%, transparent 70%);
    opacity: .6;
  }
  .card::after {
    content: ''; position: absolute; width: 900px; height: 900px; right: -300px; top: -420px;
    background: radial-gradient(circle, rgba(255,138,61,.22), transparent 62%);
  }
  .card > * { position: relative; z-index: 1; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 16px; font-family: JB; font-weight: 600; font-size: 30px; letter-spacing: -.01em; }
  .pill { font-family: JB; font-size: 19px; color: #8b93a1; border: 1px solid #2c333f; background: #0e1015; border-radius: 999px; padding: 9px 20px 9px 16px; display: flex; align-items: center; gap: 12px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #5be49b; box-shadow: 0 0 12px #5be49b; }
  .eyebrow { font-family: JB; font-size: 22px; color: #ff8a3d; margin-top: auto; }
  .eyebrow span { color: #5b6372; }
  h1 { font-family: SG; font-weight: 600; font-size: 74px; line-height: 1.04; letter-spacing: -.035em; margin: 18px 0 0; }
  h1 em { font-style: normal; color: #ff8a3d; }
  .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 44px; padding-top: 26px; border-top: 1px solid #1f242d; font-family: JB; font-size: 20px; color: #8b93a1; }
  .bottom b { color: #e8eaee; font-weight: 500; }
  .sep { color: #ff8a3d; margin: 0 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 22 22">
          <rect x="2" y="3" width="18" height="4" rx="1" fill="#e8eaee" opacity="0.35"/>
          <rect x="5" y="9" width="12" height="4" rx="1" fill="#e8eaee" opacity="0.65"/>
          <rect x="8" y="15" width="6" height="4" rx="1" fill="#ff8a3d"/>
        </svg>
        narrowstaq
      </div>
      <div class="pill"><span class="dot"></span>taking on new clients</div>
    </div>

    <p class="eyebrow"><span>// </span>fractional_cto</p>
    <h1>Senior technical leadership,<br><em>without the full-time hire.</em></h1>

    <div class="bottom">
      <span>Fractional CTO<span class="sep">·</span>Due diligence<span class="sep">·</span>Architecture &amp; team audits</span>
      <b>narrowstaq.com</b>
    </div>
  </div>
</body>
</html>
